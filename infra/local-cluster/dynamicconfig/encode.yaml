# Temporal dynamic config for the local encode cluster.
#
# Why this exists: the per-file encode fans every chunk out as an activity on the
# "encode" task queue, dispatched HIGHEST-COST-FIRST (LPT) by the workflow so the
# slow 4K/HEVC-2pass chunks lead and the cheap 360p chunks trail (see
# scripts/infinite_streaming_encoder/temporal_worker.py). That ordering is only a
# hint unless the queue is a single global FIFO.
#
# By default a Temporal task queue is split into 4 read/write PARTITIONS for
# throughput, and FIFO is preserved only WITHIN a partition — so the cost-sorted
# order gets shuffled across partitions and cheap chunks leak to the front. Our
# fleet is ~12 slots / a few hundred tasks per job: nowhere near needing 4-way
# sharding. Collapsing the "encode" queue to a single partition restores the
# global FIFO the LPT sort assumes, so heavy chunks actually lead.
#
# Scoped to taskQueueName: encode only — every other queue keeps the 4-partition
# default. See issue tracking this + the worker slot-count imbalance.

matching.numTaskqueueReadPartitions:
  - value: 1
    constraints:
      taskQueueName: encode
matching.numTaskqueueWritePartitions:
  - value: 1
    constraints:
      taskQueueName: encode

# Raise the priority ceiling from the default 5 so the workflow can encode a
# COMPOSITE priority_key = job_rank*5 + cost_band on each chunk (see #99 /
# temporal_worker.PRIORITY_LEVELS). LEVELS/BANDS = how many jobs can be ordered
# against each other: an older job's whole ladder outranks a younger job's, and
# within a job the heaviest tiers lead. priority_key: 1 = highest.
#
# 250 = 50 job ranks × 5 cost bands. It was 50 (ten ranks), and ten is reachable
# in ordinary use: a rank is assigned at launch and each launch lands one below
# the job still running, so a queue that never drains climbs one rank per job
# and saturates at the tenth. Everything past that shares the bottom band, ties,
# and falls through to the cost-band tie-break — which favours the NEWEST job,
# because it is the one still on its expensive top rungs. That is the exact
# inversion the rank exists to prevent, and it returns silently.
#
# Raising this MOVES the saturation point, it does not remove it. The growth is
# inherent: a new job must rank below the one still running, its key is fixed
# when the activity is scheduled, and with a full queue there is never a moment
# to renumber. 50 ranks is chosen to be past any plausible unbroken chain.
#
# THREE PLACES MUST AGREE, or raising this buys nothing:
#   - this value                              (the server's ceiling)
#   - temporal_worker.PRIORITY_LEVELS         (clamps the key it sends)
#   - encode.maxLocalJobRank                  (clamps the rank Go assigns)
# The Go cap is the binding one — it decides how many distinct ranks ever exist.
matching.priorityLevels:
  - value: 250
    constraints:
      taskQueueName: encode

# priority_key ordering is only honored by Temporal's NEW matcher, which is gated
# behind this flag ("Enable fairness for task dispatching. Implies
# matching.useNewMatcher."). Without it the server stores priority_key but the old
# matcher dispatches ~FIFO and ignores it — so this is REQUIRED for #99 to work,
# not optional. Scoped to the encode queue so the rest of the cluster keeps the
# default matcher.
matching.enableFairness:
  - value: true
    constraints:
      taskQueueName: encode
