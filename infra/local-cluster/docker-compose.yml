# All-container control plane for distributed-local encoding, run on the Mac
# (the "master" box). Everything here is a container with restart: unless-stopped,
# so it comes back on Docker/host start — no native agents.
#
#   temporal        durable workflow server (owns the DAG history + reschedules
#                   lost activities). Postgres-backed so state survives restarts.
#   temporal-ui     web dashboard (workflows, activities, retries) on :8233
#   postgresql      Temporal's datastore
#   minio           shared blob store — the encode queue carries S3 pointers,
#                   MinIO carries the video (mezzanine + chunks + output)
#
# Workers are NOT here — they run one-per-box (see worker.env + the Makefile
# `dist-worker-*` targets) so each machine contributes its cores. They only need
# outbound reach to temporal:7233 and minio:9000, so this compose binds those to
# the host LAN IP.
services:
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_pg:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    depends_on: [postgresql]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      # Host port is parameterized so an isolated stack (make oobe) can run a
      # second cluster alongside the real one. Container port stays 7233.
      - "${TEMPORAL_PORT:-7233}:7233"   # frontend — workers dial this (LAN IP)

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"   # web dashboard

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-encoder}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-encoder-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API — workers read/write here
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # MinIO console
    volumes:
      - minio_data:/data

volumes:
  temporal_pg:
  minio_data:
