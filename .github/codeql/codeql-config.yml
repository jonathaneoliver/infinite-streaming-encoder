# CodeQL configuration.
#
# `packs` loads this repo's own model pack, which declares
# Manager.ResolveSourceFiles as a barrier for path- and command-injection. See
# extensions/encoder-sanitisers/models/encode.model.yml for why, and for what
# that claim does and does not cover.
#
# `queries` keeps the security-extended set the workflow already selected; it is
# repeated here because specifying a config file replaces the action's own
# `queries:` input rather than merging with it.
name: encoder
queries:
  - uses: security-extended
packs:
  go:
    - jonathaneoliver/encoder-sanitisers
