name: CodeQL

# GitHub-hosted SAST. Scans Go (the control plane — the primary attack
# surface, mounting docker.sock / AWS creds / SSH) and Python (the encoder
# pipeline, incl. the boto3 cloud path). Results land in the Security tab.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly safety net catches issues from new CodeQL queries that
    # didn't exist when the code was last pushed.
    - cron: "37 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning (SARIF upload) is only available on public repos (or with
    # GitHub Advanced Security). While this repo is private the analysis runs
    # but the upload fails, so skip the job until the repo is public — at which
    # point it activates automatically with no further changes.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ go, python ]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # `security-extended` adds a slightly broader query set than the
          # default. Switch to `security-and-quality` if you want lint-style
          # findings too.
          queries: security-extended

      - name: Build (autobuild)
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
