name: CodeQL

# GitHub-hosted SAST. Scans Go (the control plane — the primary attack
# surface, mounting docker.sock / AWS creds / SSH) and Python (the encoder
# pipeline, incl. the boto3 cloud path). Results land in the Security tab.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly safety net catches issues from new CodeQL queries that
    # didn't exist when the code was last pushed.
    - cron: "37 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning (SARIF upload) is only available on public repos (or with
    # GitHub Advanced Security). While this repo is private the analysis runs
    # but the upload fails, so skip the job until the repo is public — at which
    # point it activates automatically with no further changes.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ go, python ]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: ${{ matrix.language }}
          # The query set moved into the config file: specifying `config-file`
          # REPLACES this action's own `queries:` input rather than merging, so
          # leaving it here would have quietly narrowed the analysis.
          #
          # The config loads a model pack declaring Manager.ResolveSourceFiles a
          # barrier for path- and command-injection — see
          # .github/codeql/extensions/encoder-sanitisers/models/encode.model.yml
          # for the justification and for what it deliberately does NOT claim.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build (autobuild)
        uses: github/codeql-action/autobuild@v4.37.6

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
