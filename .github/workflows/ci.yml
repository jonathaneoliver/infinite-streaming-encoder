name: ci

# Fast static checks on every PR — gofmt / go vet / build, plus a terraform
# fmt check. The end-to-end encode is covered separately by smoke.yml; this
# job is the quick "does it compile and is it formatted" gate.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The suite `make check` has run via the pre-push hook since #196 added
      # -race (it caught a real SSE data race). It was never in CI because when
      # ci.yml was written there was effectively one Go test file; there are now
      # 27 files / 127 tests, so the "no unit suite" premise has expired.
      #
      # A hook only guards machines that have it. A --no-verify push, a merge
      # made in the GitHub UI, or an agent pushing from elsewhere all reached
      # main without these ever running — including chunkplan_test.go, whose
      # whole job is keeping the Go and Python chunk planners cutting clips in
      # the same places.
      - name: go test
        run: go test -race ./...

      # Reachable-vulnerability scan. Callgraph-aware, so it reports only what
      # this code actually calls: on adoption it found 13 reachable stdlib
      # vulnerabilities and correctly discarded 12 unreachable ones. There are
      # no module dependencies, so what it guards is the toolchain floor in
      # go.mod — see the comment there.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # -checks all is NOT the default, and the difference is the point. Bare
      # `staticcheck` runs its default set, which silently excludes seven ST*
      # rules (ST1000/1003/1016/1020/1021/1022/1023) — so the previous comment
      # here claiming "ALL checks including ST*" was wrong by 20 findings.
      # Adopted at zero, so anything reported from here is new.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest -checks all ./...

  # The Python half had NO CI at all. `make check` runs a ruff F821 pass and ten
  # test scripts, but nothing ran them except a human typing `make check` — and
  # the ruff step skips silently when ruff is not installed, which it was not.
  # So the encoder itself, which is where the Python lives, was covered only by
  # smoke.yml's end-to-end run.
  #
  # That is how an undefined `is_record` sat in cli_batch's telemetry drain: on
  # a replayed SQS message it raised NameError, the drain thread's blanket
  # `except Exception: pass` swallowed it, and the rest of that pass was
  # abandoned — losing exactly the RECORDS (TIMING/SPEED/VMAF) the replay branch
  # existed to protect, silently. Static analysis had the answer the whole time
  # and was never asked.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # The whole F (pyflakes) family, not just F821.
      #
      # F821 was chosen alone on the grounds that the rest are "unused
      # imports/locals — noise rather than defects". Half right: F541 is
      # cosmetic. But F401 is the Python twin of the dead `cloudEnvPassthrough`
      # that staticcheck's U1000 had just found on the Go side — an unused
      # import is how a REMOVED mechanism keeps looking present, and reading
      # it as still wired is how CLAUDE.md came to describe a code path that
      # no longer existed.
      #
      # Cleared to zero on adoption: 9 unused imports, 5 dead assignments,
      # 2 placeholder f-strings.
      #
      # Deliberately NOT widened further. `--select ALL` reports thousands and
      # is dominated by things this codebase does on purpose: 305 T201 (print
      # is the mandated telemetry transport for cli_batch), 217 S101 (the test
      # scripts), plus D*/ANN* house style nobody has agreed to. The
      # bug-shaped families (B/PLW/RUF/PIE) were measured too and found
      # nothing real — an unused loop index, an intentional `body =
      # body.rstrip()` rebind, a doubled startswith.
      #
      # S110/BLE001 (try-except-pass, blind except) are the pattern that
      # swallowed the is_record NameError below, and are still not enabled:
      # this codebase uses them deliberately for best-effort housekeeping, so
      # they are a review judgement, not a lint rule.
      - name: ruff (pyflakes)
        run: |
          python -m pip install --quiet ruff
          ruff check --select F scripts/

      - name: python compile
        run: python -m compileall -q scripts/

      # GLOBBED, not enumerated. The first version of this step listed the ten
      # tests that existed when it was written, and was stale one merge later —
      # #184 landed scripts/test_time_limit.py and the list silently did not run
      # it. A CI job that skips a test it believes it is running is the same
      # class of bug this whole job exists to catch, so the list is derived from
      # the filesystem rather than restated here.
      #
      # These are dependency-light by design and skip themselves when boto3 is
      # absent, so no install is needed for them to be meaningful.
      - name: python tests
        run: |
          set -e
          shopt -s nullglob
          found=0
          for t in scripts/test_*.py; do
            echo "--- $t"
            python3 "$t"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "no scripts/test_*.py found — the glob is wrong, not the repo"
            exit 1
          fi
          echo "ran $found python test scripts"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
      - name: tofu fmt check
        working-directory: infra/terraform
        run: tofu fmt -check -recursive
