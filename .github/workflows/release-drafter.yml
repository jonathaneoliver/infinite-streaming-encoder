name: Release Drafter

# Drafts the next release on every push to main and on every PR (so the
# autolabeler can tag PRs as they're opened/edited). Publishing the draft
# is still manual via the GitHub UI ("Releases → Draft → Edit → Publish")
# or `gh release edit … --draft=false`.

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize, edited ]
  workflow_dispatch:

permissions:
  contents: write       # to create/update the draft release
  pull-requests: write  # to apply autolabeler labels

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      # v7 migration: token moved from `env: GITHUB_TOKEN` to `with: token`,
      # and the autolabeler is now a SEPARATE action (was built into the main
      # action in v6). The draft step runs on every trigger; the autolabeler
      # only has a PR to label on pull_request events.
      - uses: release-drafter/release-drafter@v7.7.0
        with:
          config-name: release-drafter.yml
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: release-drafter/release-drafter/autolabeler@v7.7.0
        if: github.event_name == 'pull_request'
        with:
          config-name: release-drafter.yml
          token: ${{ secrets.GITHUB_TOKEN }}
